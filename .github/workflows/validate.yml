name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Required documentation and entry points
        run: |
          for doc in README.md AGENTS.md CODEX.md PLAN.md BUILD.md reference/harness-map.md SECURITY.md; do
            test -f "$doc"
          done
          for script in install-codex-local.sh smoke-test-codex.sh eval-skill-smoke.sh codex-health.sh; do
            test -x "scripts/$script"
            bash -n "scripts/$script"
          done

      - name: Agent, skill and repository contracts
        run: |
          scripts/eval-skill-smoke.sh --quiet
          scripts/codex-health.sh --repo --quiet

      - name: Offline regressions
        run: |
          python3 scripts/check-quiet-diagnostics.py
          python3 scripts/check-installer-migration.py

      - name: ShellCheck
        run: |
          shellcheck -x scripts/install-codex-local.sh \
            scripts/smoke-test-codex.sh \
            scripts/eval-skill-smoke.sh \
            scripts/codex-health.sh
